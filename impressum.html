        <link rel="stylesheet" href="./styles/header-footer.css" />
        <link rel="stylesheet" href="./styles/main.css" />
        <style>
            .impressum-content {
                background-color: #f8f5eb;
                color: #54370d;
                font-family: "Palanquin", sans-serif;
                padding: 4rem 2rem;
                max-width: 80rem;
                margin: 0 auto;
                font-size: 1.6rem;
                line-height: 1.6;
            }
            .impressum-content h1 {
                color: #4ea487;
                font-family: "Palanquin", sans-serif;
                font-size: 3.6rem;
            }
            .back-link {
                display: inline-block;
                margin-top: 3rem;
                color: #4ea487;

                font-weight: bold;
            }
        </style>

    <body>

            <h1>Impressum</h1>
            <h2>Angaben gemäß § 5 TMG</h2>

                Travel Blog Projektgruppe<br />
                Musterstraße 123<br />
                12345 Musterstadt
            </p>
            <h2>Kontakt</h2>
            <p>
                Telefon: +49 (0) 123 456789<br />E-Mail:
                info@travelblog-projekt.de

                        src="./assets/icons/youtube_icon.png"

                <a href="https://www.facebook.com" target="_blank">

                        src="./assets/icons/facebook_icon.png"
                        alt="facebook icon"
                        class="footer-icons"
                    />
                </a>
                <a href="https://www.instagram.com" target="_blank">
                    <img
                        src="./assets/icons/Instagram_icon.png"
                        alt="instagram icon"
                        class="footer-icons"
